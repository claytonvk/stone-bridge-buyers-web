<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- FAVICON / TAB ICON -->
  <!-- Put these files in /public so they resolve as /favicon.ico, /favicon-32x32.webp, etc. -->
  <link rel="icon" href="/images/StoneBridgeBuyersLogoLight.webp" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/images/StoneBridgeBuyersLogoLight.svg" />
  <link rel="apple-touch-icon" href="/images/StoneBridgeBuyersLogoLight.svg" />

  <!-- PERFORMANCE -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=BBH+Bogle:wght@400;500;600;700;800&family=Bebas+Neue&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=BBH+Bogle&family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">

  <!-- RESPONSIVE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- BASIC SEO -->
  <title>Stone Bridge Buyers | Trusted Home Buyers - Based in Texas</title>
  <meta name="description" content="Stone Bridge Buyers is a local Texas provider of home buyers." />
  <meta name="robots" content="index,follow" />

  <!-- CANONICAL (replace with your real domain) -->
  <link rel="canonical" href="https://stonebridgebuyers.com/" />

  <!-- OPEN GRAPH (Facebook / iMessage previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Stone Bridge Buyers" />
  <meta property="og:title" content="Stone Bridge Buyers | Trusted Home Buyers - Based in Texas" />
  <meta property="og:description" content="Stone Bridge Buyers is a local Texas provider of home buyers." />
  <!-- Put a nice 1200x630 image at /public/og.webp -->
  <meta property="og:image" content="/images/HouseBanner.jpg" />
  <meta property="og:url" content="/images/HouseBanner.jpg" />

  <!-- TWITTER -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Stone Bridge Buyers is a local Texas provider of home buyers." />
  <meta name="twitter:description" content="Stone Bridge Buyers is a local Texas provider of home buyers." />
  <meta name="twitter:image" content="/images/HouseBanner.jpg" />

  <!-- LOCAL BUSINESS STRUCTURED DATA (update phone/address/url/logo) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Stone Bridge Buyers",
        "url": "https://stonebridgebuyers.com/",
        "telephone": "+1-808-829-0609",
        "areaServed": "Texas",
        "image": "/images/HouseBanner.jpg",
        "logo": "/images/StoneBridgeBuyersLogo.svg"
      }
    </script>

  <link rel="preload" as="image" href="/images/BannerImg.webp" fetchpriority="high" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
